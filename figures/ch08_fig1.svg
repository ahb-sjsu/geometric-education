 fill="#e8ecf0" text-anchor="end" font-weight="normal">ψ(G(x)): the state the</text><text x="217.60" y="241.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#e8ecf0" text-anchor="end" font-weight="normal">grade alone suggests</text><text x="478.00" y="150.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e8ecf0" text-anchor="start" font-weight="600">ΔMI = ‖ x − ψ(G(x)) ‖</text><text x="478.00" y="172.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">one arrow per graded student:</text><text x="478.00" y="188.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the longer the arrow, the more</text><text x="478.00" y="204.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the grade leaves out</text><rect x="478" y="226" width="12" height="12" rx="3" fill="#fc8d62"/><text x="496.00" y="236.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">increment for that student</text><text x="478.00" y="270.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">The career total of Theorem 8.1</text><text x="478.00" y="286.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">adds these over every student</text><text x="478.00" y="302.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight=